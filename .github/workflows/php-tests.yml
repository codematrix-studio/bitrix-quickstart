name: Проверка PHP

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  tests:
    name: PHP ${{ matrix.php }} — тесты совместимости
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: iconv
          coverage: none

      - name: Проверить синтаксис PHP
        run: |
          find local/php_interface/classes local/php_interface/legacy tests templates -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Проверить резервный автозагрузчик и автономные тесты
        working-directory: local
        run: composer test

      - name: Проверить Composer autoload через init.php
        run: |
          composer dump-autoload --working-dir=local --no-interaction
          composer --working-dir=local run-script test:autoload-composer
