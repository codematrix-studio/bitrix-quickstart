name: Проверка PHP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: PHP ${{ matrix.php }} — тесты совместимости
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: iconv
          coverage: none

      - name: Проверить синтаксис PHP
        run: |
          find local/php_interface/classes local/php_interface/legacy tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Установить Composer
        uses: composer/setup-composer@v1

      - name: Запустить автономные тесты
        working-directory: local
        run: composer test
